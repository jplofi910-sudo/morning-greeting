<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Morning Anshuuu 💜</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: white;
  text-align: center;
  overflow: hidden;
}

/* Video Style Selection */
.style-selector {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  padding: 15px 20px;
  border-radius: 50px;
  display: flex;
  gap: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.style-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.1);
  color: white;
}

.style-btn.active {
  background: linear-gradient(135deg, #ff9de2, #c471f5);
  box-shadow: 0 0 20px rgba(255, 157, 226, 0.6);
}

.style-btn:hover {
  transform: scale(1.05);
}

/* ===== STYLE 1: Cosmic Particle ===== */
body.style1 {
  background: linear-gradient(135deg, #0a0015, #2d0052, #1a0033);
}

.container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: radial-gradient(circle, rgba(255, 157, 226, 0.8), transparent);
  border-radius: 50%;
  pointer-events: none;
}

.card {
  position: relative;
  z-index: 10;
  padding: 60px 40px;
  border-radius: 40px;
  background: rgba(20, 5, 40, 0.8);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 60px rgba(255, 157, 226, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
  max-width: 600px;
}

h1 {
  font-size: clamp(45px, 12vw, 85px);
  margin: 20px 0;
  background: linear-gradient(90deg, #fff, #ff9de2, #c471f5, #fff);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  color: transparent;
  animation: gradientShift 4s ease infinite;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.decorative {
  font-size: 24px;
  letter-spacing: 8px;
  margin: 20px 0;
  animation: twinkle 2s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

p {
  font-size: 22px;
  color: #d9c5f0;
  line-height: 1.6;
  margin: 15px 0;
}

.emoji-container {
  font-size: 80px;
  margin: 20px 0;
  animation: floatAndGlow 3s ease-in-out infinite;
}

@keyframes floatAndGlow {
  0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px rgba(255, 157, 226, 0.5)); }
  50% { transform: translateY(-20px) scale(1.1); filter: drop-shadow(0 0 20px rgba(255, 157, 226, 0.8)); }
  100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px rgba(255, 157, 226, 0.5)); }
}

/* ===== STYLE 2: Aurora Wave ===== */
body.style2 {
  background: linear-gradient(180deg, #001a4d, #0d47a1, #1565c0);
  position: relative;
}

body.style2::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.2), transparent);
  animation: auroraWave 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes auroraWave {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}

body.style2 .card {
  background: rgba(10, 40, 100, 0.7);
  box-shadow: 0 0 50px rgba(0, 200, 255, 0.4);
  border: 1px solid rgba(0, 255, 200, 0.3);
}

body.style2 h1 {
  background: linear-gradient(90deg, #00ffff, #00e5ff, #00bfff, #00ffff);
  background-size: 300% 300%;
  animation: gradientShift 4s ease infinite;
}

body.style2 .emoji-container {
  animation: waveFloat 4s ease-in-out infinite;
}

@keyframes waveFloat {
  0%, 100% { transform: translateY(0) rotateZ(0deg); }
  25% { transform: translateY(-25px) rotateZ(-5deg); }
  50% { transform: translateY(0) rotateZ(0deg); }
  75% { transform: translateY(-15px) rotateZ(5deg); }
}

body.style2 .decorative {
  color: #00ffff;
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
}

body.style2 p {
  color: #b3e5fc;
}

/* ===== STYLE 3: Neon Glow ===== */
body.style3 {
  background: #0a0a0a;
  position: relative;
}

body.style3::before {
  content: '';
  position: fixed;
  top: 50%;
  left: 50%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(255, 0, 255, 0.2), transparent);
  transform: translate(-50%, -50%);
  animation: glowPulse 3s ease-in-out infinite;
  pointer-events: none;
  filter: blur(80px);
}

@keyframes glowPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.3); }
}

body.style3 .card {
  background: rgba(20, 0, 40, 0.9);
  box-shadow: 
    0 0 20px rgba(255, 0, 255, 0.4),
    0 0 40px rgba(0, 255, 200, 0.2),
    inset 0 0 20px rgba(255, 0, 255, 0.1);
  border: 2px solid rgba(255, 0, 255, 0.5);
}

body.style3 h1 {
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
  background-size: 300% 300%;
  animation: neonShift 3s ease infinite;
  text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
}

@keyframes neonShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body.style3 .emoji-container {
  animation: neonBounce 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 5px #ff00ff);
}

@keyframes neonBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.15); }
}

body.style3 .decorative {
  color: #00ffff;
  text-shadow: 0 0 8px #00ffff, 0 0 15px #ff00ff;
  animation: neonTwinkle 1.5s ease-in-out infinite;
}

@keyframes neonTwinkle {
  0%, 100% { opacity: 0.7; text-shadow: 0 0 8px #00ffff; }
  50% { opacity: 1; text-shadow: 0 0 8px #00ffff, 0 0 15px #ff00ff; }
}

body.style3 p {
  color: #00ffff;
  text-shadow: 0 0 5px #00ffff;
}

/* Video Duration Indicator */
.video-duration {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  padding: 10px 20px;
  border-radius: 50px;
  font-size: 14px;
  color: #d9c5f0;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.progress-bar {
  width: 200px;
  height: 3px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50px;
  margin-top: 8px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff9de2, #c471f5);
  border-radius: 50px;
  animation: progressFill 5s linear forwards;
}

@keyframes progressFill {
  0% { width: 0%; }
  100% { width: 100%; }
}

@media (max-width: 600px) {
  .card {
    padding: 40px 20px;
    margin: 20px;
  }

  h1 {
    font-size: clamp(30px, 8vw, 60px);
  }

  .emoji-container {
    font-size: 60px;
  }

  .style-selector {
    top: 10px;
    right: 10px;
    padding: 10px 15px;
    flex-direction: column;
  }

  .style-btn {
    font-size: 11px;
    padding: 6px 12px;
  }
}
</style>
</head>
<body class="style1">

<div class="style-selector">
  <button class="style-btn active" onclick="setStyle('style1')">✦ Cosmic</button>
  <button class="style-btn" onclick="setStyle('style2')">✧ Aurora</button>
  <button class="style-btn" onclick="setStyle('style3')">✦ Neon</button>
</div>

<div class="particles"></div>

<div class="container">
  <div class="card">
    <div class="decorative">✦ ✧ ✦</div>
    <h1>Good Morning<br>Anshuuu 💜</h1>
    <p>Have a beautiful &<br>amazing day ✨</p>
    <div class="emoji-container">🌷</div>
  </div>
</div>

<div class="video-duration">
  <span id="timeDisplay">Video: 0:00 / 0:05</span>
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>
</div>

<script>
function setStyle(style) {
  document.body.className = style;
  
  // Update active button
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  // Reset animation by restarting
  const card = document.querySelector('.card');
  card.style.animation = 'none';
  setTimeout(() => {
    card.style.animation = '';
  }, 10);
}

// Generate particles for style1
function generateParticles() {
  const container = document.querySelector('.particles');
  container.innerHTML = '';
  
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.width = Math.random() * 100 + 20 + 'px';
    particle.style.height = particle.style.width;
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animation = `float ${Math.random() * 8 + 4}s linear infinite`;
    particle.style.opacity = Math.random() * 0.5 + 0.1;
    container.appendChild(particle);
  }
}

// Float animation for particles
const style = document.createElement('style');
style.textContent = `
  @keyframes float {
    0% { transform: translate(0, 0); opacity: 0.1; }
    50% { opacity: 0.5; }
    100% { transform: translate(${Math.random() * 200 - 100}px, -${Math.random() * 300 + 200}px); opacity: 0.1; }
  }
`;
document.head.appendChild(style);

generateParticles();

// Video timer
let elapsed = 0;
const interval = setInterval(() => {
  elapsed += 0.1;
  const seconds = Math.floor(elapsed);
  const milliseconds = Math.floor((elapsed % 1) * 10);
  const display = `Video: 0:0${seconds}.${milliseconds} / 0:05`;
  document.getElementById('timeDisplay').textContent = display;
  
  if (elapsed >= 5) {
    elapsed = 0;
  }
}, 100);

// Reset animation on visibility change
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(interval);
  } else {
    elapsed = 0;
  }
});
</script>

</body>
</html>
