<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Good Morning Anshuuu 💜</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: white;
  text-align: center;
  overflow: hidden;
}

/* Video Style Selection */
.style-selector {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  padding: 15px 20px;
  border-radius: 50px;
  display: flex;
  gap: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.style-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  transition: all 0.3s ease;
  background: rgba(255, 255, 255, 0.1);
  color: white;
}

.style-btn.active {
  background: linear-gradient(135deg, #ff9de2, #c471f5);
  box-shadow: 0 0 20px rgba(255, 157, 226, 0.6);
}

.style-btn:hover {
  transform: scale(1.05);
}

/* ===== STYLE 1: Cosmic Particle ===== */
body.style1 {
  background: linear-gradient(135deg, #0a0015, #2d0052, #1a0033);
}

.container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.particles {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.particle {
  position: absolute;
  background: radial-gradient(circle, rgba(255, 157, 226, 0.8), transparent);
  border-radius: 50%;
  pointer-events: none;
}

.card {
  position: relative;
  z-index: 10;
  padding: 60px 40px;
  border-radius: 40px;
  background: rgba(20, 5, 40, 0.8);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 60px rgba(255, 157, 226, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
  max-width: 600px;
}

h1 {
  font-size: clamp(45px, 12vw, 85px);
  margin: 20px 0;
  background: linear-gradient(90deg, #fff, #ff9de2, #c471f5, #fff);
  background-size: 300% 300%;
  -webkit-background-clip: text;
  color: transparent;
  animation: gradientShift 4s ease infinite;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.decorative {
  font-size: 24px;
  letter-spacing: 8px;
  margin: 20px 0;
  animation: twinkle 2s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

p {
  font-size: 22px;
  color: #d9c5f0;
  line-height: 1.6;
  margin: 15px 0;
}

.emoji-container {
  font-size: 80px;
  margin: 20px 0;
  animation: floatAndGlow 3s ease-in-out infinite;
}

@keyframes floatAndGlow {
  0% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px rgba(255, 157, 226, 0.5)); }
  50% { transform: translateY(-20px) scale(1.1); filter: drop-shadow(0 0 20px rgba(255, 157, 226, 0.8)); }
  100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0px rgba(255, 157, 226, 0.5)); }
}

/* ===== STYLE 2: Aurora Wave ===== */
body.style2 {
  background: linear-gradient(180deg, #001a4d, #0d47a1, #1565c0);
  position: relative;
}

body.style2::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    linear-gradient(90deg, transparent, rgba(0, 255, 200, 0.2), transparent);
  animation: auroraWave 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes auroraWave {
  0% { transform: translateX(-100%); }
  50% { transform: translateX(0); }
  100% { transform: translateX(100%); }
}

body.style2 .card {
  background: rgba(10, 40, 100, 0.7);
  box-shadow: 0 0 50px rgba(0, 200, 255, 0.4);
  border: 1px solid rgba(0, 255, 200, 0.3);
}

body.style2 h1 {
  background: linear-gradient(90deg, #00ffff, #00e5ff, #00bfff, #00ffff);
  background-size: 300% 300%;
  animation: gradientShift 4s ease infinite;
}

body.style2 .emoji-container {
  animation: waveFloat 4s ease-in-out infinite;
}

@keyframes waveFloat {
  0%, 100% { transform: translateY(0) rotateZ(0deg); }
  25% { transform: translateY(-25px) rotateZ(-5deg); }
  50% { transform: translateY(0) rotateZ(0deg); }
  75% { transform: translateY(-15px) rotateZ(5deg); }
}

body.style2 .decorative {
  color: #00ffff;
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
}

body.style2 p {
  color: #b3e5fc;
}

/* ===== STYLE 3: Neon Glow ===== */
body.style3 {
  background: #0a0a0a;
  position: relative;
}

body.style3::before {
  content: '';
  position: fixed;
  top: 50%;
  left: 50%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(255, 0, 255, 0.2), transparent);
  transform: translate(-50%, -50%);
  animation: glowPulse 3s ease-in-out infinite;
  pointer-events: none;
  filter: blur(80px);
}

@keyframes glowPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-50%, -50%) scale(1.3); }
}

body.style3 .card {
  background: rgba(20, 0, 40, 0.9);
  box-shadow: 
    0 0 20px rgba(255, 0, 255, 0.4),
    0 0 40px rgba(0, 255, 200, 0.2),
    inset 0 0 20px rgba(255, 0, 255, 0.1);
  border: 2px solid rgba(255, 0, 255, 0.5);
}

body.style3 h1 {
  background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
  background-size: 300% 300%;
  animation: neonShift 3s ease infinite;
  text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
}

@keyframes neonShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body.style3 .emoji-container {
  animation: neonBounce 2.5s ease-in-out infinite;
  filter: drop-shadow(0 0 10px #00ffff) drop-shadow(0 0 5px #ff00ff);
}

@keyframes neonBounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-30px) scale(1.15); }
}

body.style3 .decorative {
  color: #00ffff;
  text-shadow: 0 0 8px #00ffff, 0 0 15px #ff00ff;
  animation: neonTwinkle 1.5s ease-in-out infinite;
}

@keyframes neonTwinkle {
  0%, 100% { opacity: 0.7; text-shadow: 0 0 8px #00ffff; }
  50% { opacity: 1; text-shadow: 0 0 8px #00ffff, 0 0 15px #ff00ff; }
}

body.style3 p {
  color: #00ffff;
  text-shadow: 0 0 5px #00ffff;
}

/* Video Duration Indicator */
.video-duration {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  padding: 10px 20px;
  border-radius: 50px;
  font-size: 14px;
  color: #d9c5f0;
  border: 1px solid rgba(255, 255, 255, 0.2);
}

.progress-bar {
  width: 200px;
  height: 3px;
  background: rgba(255, 255, 255, 0.2);
  border-radius: 50px;
  margin-top: 8px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff9de2, #c471f5);
  border-radius: 50px;
  animation: progressFill 5s linear forwards;
}

@keyframes progressFill {
  0% { width: 0%; }
  100% { width: 100%; }
}

/* QR Code Button */
.qr-button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, #ff9de2, #c471f5);
  border: none;
  cursor: pointer;
  font-size: 28px;
  box-shadow: 0 0 30px rgba(255, 157, 226, 0.5);
  transition: all 0.3s ease;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qr-button:hover {
  transform: scale(1.1);
  box-shadow: 0 0 40px rgba(255, 157, 226, 0.8);
}

/* QR Code Modal */
.qr-modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  backdrop-filter: blur(5px);
  z-index: 2000;
  justify-content: center;
  align-items: center;
}

.qr-modal.active {
  display: flex;
}

.qr-content {
  background: rgba(20, 5, 40, 0.95);
  border-radius: 30px;
  padding: 40px;
  border: 2px solid rgba(255, 157, 226, 0.5);
  box-shadow: 0 0 50px rgba(255, 157, 226, 0.3);
  text-align: center;
  animation: popIn 0.3s ease;
}

@keyframes popIn {
  0% { transform: scale(0.8) rotateZ(-5deg); opacity: 0; }
  100% { transform: scale(1) rotateZ(0deg); opacity: 1; }
}

.qr-content h2 {
  margin-bottom: 20px;
  font-size: 28px;
  background: linear-gradient(90deg, #fff, #ff9de2);
  -webkit-background-clip: text;
  color: transparent;
}

.qr-code-canvas {
  background: white;
  padding: 20px;
  border-radius: 20px;
  margin: 20px 0;
  box-shadow: 0 0 30px rgba(255, 157, 226, 0.2);
}

.qr-url {
  color: #00ffff;
  font-size: 12px;
  word-break: break-all;
  margin: 15px 0;
  padding: 10px;
  background: rgba(0, 255, 255, 0.1);
  border-radius: 10px;
  font-family: 'Courier New', monospace;
}

.copy-btn {
  background: linear-gradient(135deg, #ff9de2, #c471f5);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
  transition: all 0.3s ease;
}

.copy-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(255, 157, 226, 0.6);
}

.close-qr {
  position: absolute;
  top: 20px;
  right: 20px;
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
  z-index: 2001;
}

.close-qr:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: rotate(90deg);
}

@media (max-width: 600px) {
  .card {
    padding: 40px 20px;
    margin: 20px;
  }

  h1 {
    font-size: clamp(30px, 8vw, 60px);
  }

  .emoji-container {
    font-size: 60px;
  }

  .style-selector {
    top: 10px;
    right: 10px;
    padding: 10px 15px;
    flex-direction: column;
  }

  .style-btn {
    font-size: 11px;
    padding: 6px 12px;
  }

  .qr-button {
    width: 50px;
    height: 50px;
    font-size: 24px;
  }

  .qr-content {
    padding: 30px 20px;
    margin: 20px;
    max-width: 90vw;
  }

  .qr-content h2 {
    font-size: 22px;
  }
}
</style>
</head>
<body class="style1">

<div class="style-selector">
  <button class="style-btn active" onclick="setStyle('style1')">✦ Cosmic</button>
  <button class="style-btn" onclick="setStyle('style2')">✧ Aurora</button>
  <button class="style-btn" onclick="setStyle('style3')">✦ Neon</button>
</div>

<div class="particles"></div>

<div class="container">
  <div class="card">
    <div class="decorative">✦ ✧ ✦</div>
    <h1>Good Morning<br>Anshuuu 💜</h1>
    <p>Have a beautiful &<br>amazing day ✨</p>
    <div class="emoji-container">🌷</div>
  </div>
</div>

<div class="video-duration">
  <span id="timeDisplay">Video: 0:00 / 0:05</span>
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>
</div>

<button class="qr-button" onclick="toggleQRModal()">📱</button>

<div class="qr-modal" id="qrModal">
  <button class="close-qr" onclick="toggleQRModal()">✕</button>
  <div class="qr-content">
    <h2>Scan to Share 💜</h2>
    <p style="color: #d9c5f0; margin-bottom: 15px;">Share this greeting with anyone!</p>
    <canvas id="qrCanvas" class="qr-code-canvas"></canvas>
    <div class="qr-url" id="qrUrl"></div>
    <button class="copy-btn" onclick="copyToClipboard()">📋 Copy Link</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
function setStyle(style) {
  document.body.className = style;
  
  // Update active button
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
  
  // Reset animation by restarting
  const card = document.querySelector('.card');
  card.style.animation = 'none';
  setTimeout(() => {
    card.style.animation = '';
  }, 10);
}

// Generate particles for style1
function generateParticles() {
  const container = document.querySelector('.particles');
  container.innerHTML = '';
  
  for (let i = 0; i < 20; i++) {
    const particle = document.createElement('div');
    particle.className = 'particle';
    particle.style.width = Math.random() * 100 + 20 + 'px';
    particle.style.height = particle.style.width;
    particle.style.left = Math.random() * 100 + '%';
    particle.style.top = Math.random() * 100 + '%';
    particle.style.animation = `float ${Math.random() * 8 + 4}s linear infinite`;
    particle.style.opacity = Math.random() * 0.5 + 0.1;
    container.appendChild(particle);
  }
}

// Float animation for particles
const style = document.createElement('style');
style.textContent = `
  @keyframes float {
    0% { transform: translate(0, 0); opacity: 0.1; }
    50% { opacity: 0.5; }
    100% { transform: translate(${Math.random() * 200 - 100}px, -${Math.random() * 300 + 200}px); opacity: 0.1; }
  }
`;
document.head.appendChild(style);

generateParticles();

// Video timer
let elapsed = 0;
const interval = setInterval(() => {
  elapsed += 0.1;
  const seconds = Math.floor(elapsed);
  const milliseconds = Math.floor((elapsed % 1) * 10);
  const display = `Video: 0:0${seconds}.${milliseconds} / 0:05`;
  document.getElementById('timeDisplay').textContent = display;
  
  if (elapsed >= 5) {
    elapsed = 0;
  }
}, 100);

// Reset animation on visibility change
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearInterval(interval);
  } else {
    elapsed = 0;
  }
});

// QR Code functionality
function toggleQRModal() {
  const modal = document.getElementById('qrModal');
  modal.classList.toggle('active');
  
  if (modal.classList.contains('active')) {
    generateQRCode();
  }
}

function generateQRCode() {
  const canvas = document.getElementById('qrCanvas');
  const urlDisplay = document.getElementById('qrUrl');
  
  // Get current URL
  const currentURL = window.location.href;
  urlDisplay.textContent = currentURL;
  
  // Clear previous QR code
  canvas.innerHTML = '';
  
  // Generate new QR code
  const qr = new QRCode(canvas, {
    text: currentURL,
    width: 250,
    height: 250,
    colorDark: "#000000",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.H
  });
}

function copyToClipboard() {
  const urlDisplay = document.getElementById('qrUrl');
  const url = urlDisplay.textContent;
  
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    const originalText = btn.textContent;
    btn.textContent = '✓ Copied!';
    btn.style.background = 'linear-gradient(135deg, #00ff00, #00cc00)';
    
    setTimeout(() => {
      btn.textContent = originalText;
      btn.style.background = 'linear-gradient(135deg, #ff9de2, #c471f5)';
    }, 2000);
  }).catch(err => {
    alert('Failed to copy: ' + err);
  });
}

// Close modal on outside click
document.getElementById('qrModal').addEventListener('click', (e) => {
  if (e.target.id === 'qrModal') {
    toggleQRModal();
  }
});
</script>

</body>
</html>
